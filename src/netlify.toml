[build]
  command = "mkdir -p src/environments && printf \"export const environment = { production: true, apiUrl: '%s', mapboxToken: '%s' };\\n\" \"$API_URL\" \"$MAPBOX_TOKEN\" > src/environments/environment.ts && cp src/environments/environment.ts src/environments/environment.prod.ts && npx ng build --configuration production"
  publish = "dist/front-bakery/browser"

[build.environment]
  NODE_VERSION = "20"
